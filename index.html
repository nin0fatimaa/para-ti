
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti 💗</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: #ffe6f0;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Georgia, serif;
    }

    .contenido {
        text-align: center;
        z-index: 2;
    }

    .corazon {
        font-size: 130px;
        color: #d96c9d;
        animation: latido 1.2s infinite;
    }

    .mensaje {
        font-size: 35px;
        font-style: italic;
        color: #c44569;
        margin-top: 10px;
    }

    .flor {
        position: absolute;
        font-size: 28px;
        animation: flotar linear infinite;
        image-rendering: pixelated;
    }

    @keyframes latido {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
    }

    @keyframes flotar {
        0% {
            transform: translateY(110vh) rotate(0deg);
            opacity: 0;
        }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% {
            transform: translateY(-15vh) rotate(180deg);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="contenido">
    <div class="corazon">♥</div>
    <div class="mensaje" id="mensaje">Te extraño ♡</div>
</div>

<script>
    // Crear flores flotantes
    const flores = ["🌸", "🌷", "🌼", "🌺"];

    for (let i = 0; i < 18; i++) {
        const flor = document.createElement("div");

        flor.className = "flor";
        flor.textContent = flores[Math.floor(Math.random() * flores.length)];

        flor.style.left = Math.random() * 100 + "vw";
        flor.style.animationDuration = (5 + Math.random() * 7) + "s";
        flor.style.animationDelay = Math.random() * 8 + "s";

        document.body.appendChild(flor);
    }

    // Cambiar mensajes
    const mensajes = [
        "Te extraño ♡",
        "Te quiero mucho ♡",
        "Regresaaaa Jovanni ♡",
        "Eres lo mejor que me ha pasado ♡",
    ];

    let indice = 0;

    setInterval(() => {
        indice = (indice + 1) % mensajes.length;

        const mensaje = document.getElementById("mensaje");

        mensaje.style.opacity = 0;

        setTimeout(() => {
            mensaje.textContent = mensajes[indice];
            mensaje.style.opacity = 1;
        }, 500);

    }, 3000);
</script>

</body>
</html>
